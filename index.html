<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Success Hub - Meeting Portal</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 25px 20px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 440px;
      animation: fadeIn 0.8s ease-in-out;
      position: relative;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .brand-title {
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .brand-subtitle {
      text-align: center;
      font-size: 13px;
      color: #666;
      margin-bottom: 12px;
      font-weight: 500;
    }
    .notice-banner {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      color: #856404;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      font-weight: 600;
      margin-bottom: 15px;
    }
    .countdown-box {
      background: linear-gradient(135deg, #11998e, #38ef7d);
      color: white;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .countdown-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .countdown-timer {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
    }
    .tabs {
      display: flex;
      margin-bottom: 15px;
      border-bottom: 2px solid #eee;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      color: #888;
      transition: all 0.3s ease;
    }
    .tab-btn.active {
      color: #ff416c;
      border-bottom: 3px solid #ff416c;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
      color: #444;
      font-size: 13px;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: #ff416c;
      box-shadow: 0 0 5px rgba(255, 65, 108, 0.3);
    }
    button.btn-submit {
      width: 100%;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 8px;
      transition: transform 0.2s, opacity 0.2s;
    }
    button.btn-submit:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .admin-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #777;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
    }
    .admin-link:hover {
      color: #ff416c;
      text-decoration: underline;
    }

    /* Modal Admin Panel Overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }
    .modal-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      position: relative;
    }
    .modal-header {
      font-size: 18px;
      font-weight: 700;
      color: #ff416c;
      margin-bottom: 15px;
      text-align: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }
    .close-btn {
      position: absolute;
      top: 12px; right: 15px;
      font-size: 20px;
      cursor: pointer;
      color: #999;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="brand-title">Global Success Hub</div>
  <div class="brand-subtitle">Online / Offline Work & Meeting Portal</div>
  
  <div class="notice-banner">
    ⚠️ ध्यान दें: कृपया मीटिंग शुरू होने के 5 मिनट पहले ही लॉगिन करें।
  </div>

  <div class="countdown-box">
    <div class="countdown-title">अगली मीटिंग में शेष समय</div>
    <div id="timerDisplay" class="countdown-timer">00:00:00</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('signin')">साइन इन (पुराने सदस्य)</button>
    <button class="tab-btn" onclick="switchTab('signup')">साइन अप (नए सदस्य)</button>
  </div>

  <!-- Sign In Form -->
  <form id="signinForm" onsubmit="handleSignIn(event)">
    <div class="form-group">
      <label>मोबाइल नंबर</label>
      <input type="tel" id="loginMobile" pattern="[0-9]{10}" required placeholder="10 अंकों का मोबाइल नंबर">
    </div>
    <div class="form-group">
      <label>पासवर्ड</label>
      <input type="password" id="loginPassword" required placeholder="अपना पासवर्ड दर्ज करें">
    </div>
    <button type="submit" class="btn-submit">मीटिंग जॉइन करें</button>
  </form>

  <!-- Sign Up Form -->
  <form id="signupForm" onsubmit="handleSignUp(event)" style="display: none;">
    <div class="form-group">
      <label>पूरा नाम</label>
      <input type="text" id="regName" required placeholder="अपना नाम दर्ज करें">
    </div>
    <div class="form-group">
      <label>मोबाइल नंबर</label>
      <input type="tel" id="regMobile" pattern="[0-9]{10}" required placeholder="10 अंकों का मोबाइल नंबर">
    </div>
    <div class="form-group">
      <label>पता / स्थान</label>
      <input type="text" id="regAddress" required placeholder="शहर या गांव का नाम">
    </div>
    <div class="form-group">
      <label>रेफरल मोबाइल नंबर (जिसने इनवाइट किया)</label>
      <input type="tel" id="regReferral" pattern="[0-9]{10}" placeholder="इनवाइट करने वाले का 10 अंकों का मोबाइल नंबर">
    </div>
    <div class="form-group">
      <label>पासवर्ड बनाएं</label>
      <input type="password" id="regPassword" required placeholder="पासवर्ड बनाएं">
    </div>
    <button type="submit" class="btn-submit">रजिस्टर करें</button>
  </form>

  <a href="#" class="admin-link" onclick="openAdminAuthModal()">एडमिन लॉगिन (केवल एडमिन हेतु)</a>
</div>

<!-- Admin Settings Modal Popup -->
<div id="adminModal" class="modal-overlay">
  <div class="modal-card">
    <span class="close-btn" onclick="closeAdminModal()">&times;</span>
    <div class="modal-header">⚙️ एडमिन कंट्रोल पैनल</div>
    <form id="adminSettingsForm" onsubmit="handleAdminUpdate(event)">
      <div class="form-group">
        <label>1. नई Zoom / Meet लिंक</label>
        <input type="url" id="admLink" required placeholder="https://zoom.us/j/...">
      </div>
      <div class="form-group">
        <label>2. मीटिंग शुरू होने का समय (Select Hour & Minute)</label>
        <!-- Time Picker Input -->
        <input type="time" id="admTime" required style="cursor: pointer; padding: 10px; font-weight: bold;">
      </div>
      <div class="form-group">
        <label>3. मीटिंग की अवधि (Minutes)</label>
        <input type="number" id="admDuration" required placeholder="उदा: 45">
      </div>
      <button type="submit" class="btn-submit" style="background: linear-gradient(45deg, #11998e, #38ef7d);">सेटिंग्स सेव करें</button>
    </form>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbykZvD6nP6QorHUew8wsmaQ7b8ycq0woVVnMTaZC8fE4hNNUF1taeLEBrCmU9UnsHDD/exec";
  let meetingTargetTimeStr = "20:30";
  let currentAdminId = "";
  let currentAdminPass = "";
  let lastVoiceAlert1Hour = false;
  let lastVoiceAlert10Min = false;

  $(document).ready(function() {
    fetchMeetingDetails();
    setInterval(fetchMeetingDetails, 30000);
    setInterval(updateCountdown, 1000);
  });

  function speakText(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'hi-IN';
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }
  }

  function switchTab(type) {
    $('.tab-btn').removeClass('active');
    if(type === 'signin') {
      $('.tab-btn:nth-child(1)').addClass('active');
      $('#signinForm').show();
      $('#signupForm').hide();
    } else {
      $('.tab-btn:nth-child(2)').addClass('active');
      $('#signinForm').hide();
      $('#signupForm').show();
    }
  }

  function fetchMeetingDetails() {
    fetch(SCRIPT_URL + "?action=getMeetingDetails")
      .then(res => res.json())
      .then(data => {
        if(data.success && data.time) {
          let str = data.time.toString();
          let match = str.match(/([0-1]?[0-9]|2[0-3]):([0-5][0-9])/);
          if (match) {
            meetingTargetTimeStr = match[0];
          } else {
            meetingTargetTimeStr = "20:30";
          }
        }
      })
      .catch(err => console.log("Fetch error:", err));
  }

  function updateCountdown() {
    if (!meetingTargetTimeStr) return;
    
    let parts = meetingTargetTimeStr.split(':');
    if (parts.length < 2) return;

    let targetHours = parseInt(parts[0], 10);
    let targetMinutes = parseInt(parts[1], 10);

    if (isNaN(targetHours) || isNaN(targetMinutes)) return;

    const now = new Date();
    let target = new Date();
    target.setHours(targetHours, targetMinutes, 0, 0);

    if (now > target) {
      target.setDate(target.getDate() + 1);
    }

    const diff = target - now;
    if (diff <= 0) {
      $('#timerDisplay').text("00:00:00");
      return;
    }

    let totalSeconds = Math.floor(diff / 1000);
    let hours = Math.floor((totalSeconds % (24 * 3600)) / 3600);
    let minutes = Math.floor((totalSeconds % 3600) / 60);
    let seconds = totalSeconds % 60;

    $('#timerDisplay').text(
      String(hours).padStart(2, '0') + ":" +
      String(minutes).padStart(2, '0') + ":" +
      String(seconds).padStart(2, '0')
    );

    if (diff > 3590000 && diff < 3610000 && !lastVoiceAlert1Hour) {
      speakText("आपकी मीटिंग शुरू होने में मात्र 1 घंटा शेष है कृपया समय से मीटिंग ज्वाइन करें।");
      lastVoiceAlert1Hour = true;
    }
    if (diff > 590000 && diff < 610000 && !lastVoiceAlert10Min) {
      speakText("आपकी मीटिंग शुरू होने में मात्र 10 मिनट शेष है कृपया समय से मीटिंग ज्वाइन करें।");
      lastVoiceAlert10Min = true;
    }
  }

  function handleSignUp(e) {
    e.preventDefault();
    const refVal = $('#regReferral').val().trim() || "Direct / Self";
    
    const params = new URLSearchParams({
      action: "signup",
      name: $('#regName').val(),
      mobile: $('#regMobile').val(),
      address: $('#regAddress').val(),
      referral: refVal,
      password: $('#regPassword').val()
    });

    fetch(SCRIPT_URL + "?" + params.toString())
    .then(res => res.json())
    .then(data => {
      if(data.success) {
        speakText("आपने अपना रजिस्ट्रेशन सफलतापूर्वक कर लिया है। अब कृपया साइन इन करें। धन्यवाद।");
        alert(data.message);
        switchTab('signin');
        $('#loginMobile').val($('#regMobile').val());
        $('#signupForm')[0].reset();
      } else {
        alert(data.message);
      }
    })
    .catch(err => alert("Connection error: " + err));
  }

  function handleSignIn(e) {
    e.preventDefault();
    const params = new URLSearchParams({
      action: "signin",
      mobile: $('#loginMobile').val(),
      password: $('#loginPassword').val()
    });

    speakText("आपका अकाउंट मीटिंग हेतु लॉगिन किया जा रहा है। आपकी सफलता हेतु आपको अग्रिम बधाइयां।");

    fetch(SCRIPT_URL + "?" + params.toString())
    .then(res => res.json())
    .then(data => {
      if(data.success) {
        setTimeout(function() {
          redirectToMeeting();
        }, 2000);
      } else {
        alert(data.message);
      }
    })
    .catch(err => alert("Connection error: " + err));
  }

  function redirectToMeeting() {
    fetch(SCRIPT_URL + "?action=getMeetingDetails")
      .then(res => res.json())
      .then(data => {
        if(data.success && data.link) {
          window.location.href = data.link;
        } else {
          alert("मीटिंग लिंक उपलब्ध नहीं है। कृपया एडमिन से संपर्क करें।");
        }
      });
  }

  function openAdminAuthModal() {
    const adminId = prompt("Admin ID दर्ज करें:");
    if (!adminId) return;
    const adminPass = prompt("Admin Password दर्ज करें:");
    if (!adminPass) return;

    const params = new URLSearchParams({
      action: "adminLogin",
      adminId: adminId,
      adminPass: adminPass
    });

    fetch(SCRIPT_URL + "?" + params.toString())
    .then(res => res.json())
    .then(resData => {
      if(resData.success) {
        currentAdminId = adminId;
        currentAdminPass = adminPass;
        $('#admLink').val(resData.link || "");
        $('#admTime').val(resData.time || "20:30");
        $('#admDuration').val(resData.duration || "45");
        $('#adminModal').css('display', 'flex');
      } else {
        alert(resData.message);
      }
    });
  }

  function closeAdminModal() {
    $('#adminModal').hide();
  }

  function handleAdminUpdate(e) {
    e.preventDefault();
    const newTimeVal = $('#admTime').val();

    const updateParams = new URLSearchParams({
      action: "adminUpdate",
      adminId: currentAdminId,
      adminPass: currentAdminPass,
      newLink: $('#admLink').val(),
      newTime: newTimeVal,
      newDuration: $('#admDuration').val()
    });

    fetch(SCRIPT_URL + "?" + updateParams.toString())
    .then(res => res.json())
    .then(data => {
      alert(data.message);
      if(data.success) {
        meetingTargetTimeStr = newTimeVal;
        updateCountdown();
        closeAdminModal();
      }
    });
  }
</script>

</body>
</html>
